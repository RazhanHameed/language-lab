<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Leer Nederlands / Lern Deutsch — daily practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css?v=4" />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇳🇱</text></svg>"
  />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-name">Leer&nbsp;Nederlands</span>
    </div>
    <nav class="tabs desktop-only" role="tablist" aria-label="Primary">
      <button data-view="home" class="tab is-active" role="tab">Home</button>
      <button data-view="study" class="tab" role="tab">Study</button>
      <button data-view="browse" class="tab" role="tab">Browse</button>
      <button data-view="stats" class="tab" role="tab">Stats</button>
    </nav>
    <div class="header-actions">
      <span id="lang-switch"></span>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle color theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <nav class="bottom-nav mobile-only" role="tablist" aria-label="Primary mobile">
    <button data-view="home" class="bn-tab is-active" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>
      <span>Home</span>
    </button>
    <button data-view="study" class="bn-tab" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l10-4 10 4-10 4Z"/><path d="M6 9.5V15c2 2 10 2 12 0V9.5"/></svg>
      <span>Study</span>
    </button>
    <button data-view="browse" class="bn-tab" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
      <span>Browse</span>
    </button>
    <button data-view="stats" class="bn-tab" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-7"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <!-- deck registry, then each language's data files -->
  <script src="js/data/_boot.js?v=4"></script>
  <script src="js/data/nl/vocab.js?v=4"></script>
  <script src="js/data/nl/sentences.js?v=4"></script>
  <script src="js/data/nl/scenarios.js?v=4"></script>
  <script src="js/data/nl/grammar.js?v=4"></script>
  <script src="js/data/nl/conjugations.js?v=4"></script>
  <script src="js/data/nl/minimal_pairs.js?v=4"></script>
  <script src="js/data/nl/chunks.js?v=4"></script>
  <script src="js/data/nl/passages.js?v=4"></script>
  <script src="js/data/de/vocab.js?v=4"></script>
  <script src="js/data/de/sentences.js?v=4"></script>
  <script src="js/data/de/scenarios.js?v=4"></script>
  <script src="js/data/de/grammar.js?v=4"></script>
  <script src="js/data/de/conjugations.js?v=4"></script>
  <script src="js/data/de/minimal_pairs.js?v=4"></script>
  <script src="js/data/de/chunks.js?v=4"></script>
  <script src="js/data/de/passages.js?v=4"></script>
  <script src="js/data/ckb/vocab.js?v=4"></script>
  <script src="js/data/ckb/sentences.js?v=4"></script>
  <script src="js/data/ckb/scenarios.js?v=4"></script>
  <script src="js/data/ckb/grammar.js?v=4"></script>
  <script src="js/data/ckb/conjugations.js?v=4"></script>
  <script src="js/data/ckb/minimal_pairs.js?v=4"></script>
  <script src="js/data/ckb/chunks.js?v=4"></script>
  <script src="js/data/ckb/passages.js?v=4"></script>
  <script src="js/data/kmr/vocab.js?v=4"></script>
  <script src="js/data/kmr/sentences.js?v=4"></script>
  <script src="js/data/kmr/scenarios.js?v=4"></script>
  <script src="js/data/kmr/grammar.js?v=4"></script>
  <script src="js/data/kmr/conjugations.js?v=4"></script>
  <script src="js/data/kmr/minimal_pairs.js?v=4"></script>
  <script src="js/data/kmr/chunks.js?v=4"></script>
  <script src="js/data/kmr/passages.js?v=4"></script>

  <!-- language manager + language packs (engine reads these via Lang.cfg()) -->
  <script src="js/lang.js?v=4"></script>
  <script src="js/lang/nl.js?v=4"></script>
  <script src="js/lang/de.js?v=4"></script>
  <script src="js/lang/ckb.js?v=4"></script>
  <script src="js/lang/kmr.js?v=4"></script>

  <!-- shared engine -->
  <script src="js/storage.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/srs.js?v=4"></script>
  <script src="js/drills.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
