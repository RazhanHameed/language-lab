    rel="stylesheet"
  />
  <script>
    /* Apply the saved look before first paint so there is no flash. */
    (function () {
      try {
        var d = document.documentElement, ls = window.localStorage;
        var th = ls.getItem("learn:theme"), ts = ls.getItem("learn:textsize");
        if (!th) { /* carry over a theme chosen in an older version */
          for (var i = 0; i < ls.length && !th; i++) {
            var k = ls.key(i);
            if (k && /:v1$/.test(k)) {
              try { var s = JSON.parse(ls.getItem(k)); var o = s && s.settings && s.settings.theme; if (o === "light" || o === "dark") th = o; } catch (e) {}
            }
          }
        }
        if (/^(auto|light|dark|easy|contrast)$/.test(th)) d.setAttribute("data-theme", th);
        if (/^[0-3]$/.test(ts)) d.setAttribute("data-textsize", ts);
      } catch (e) {}
    })();
  </script>
